<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Crea tu cuenta completando el formulario de registro."
    />
    <meta name="theme-color" content="#0d1b2a" />
    <title>Crear cuenta | Registro</title>
    <link rel="icon" type="image/svg+xml" href="image/favicon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="pagina pagina-registro">
    <header class="cabecera-sitio">
      <a class="marca" href="index.html" aria-label="Registro, página de inicio">
        <span class="marca-icono" aria-hidden="true">R</span>
        <span class="marca-nombre">REGISTRO</span>
      </a>
    </header>

    <main class="contenido-principal">
      <section class="seccion-registro" aria-labelledby="titulo-registro">
        <article class="tarjeta tarjeta-registro">
          <header class="cabecera-tarjeta">
            <p class="etiqueta-seccion">CREA TU PERFIL</p>
            <h1 class="titulo-principal" id="titulo-registro">Crear cuenta</h1>
            <p class="texto-intro">
              Completa tus datos para crear un perfil en este navegador. No se
              guardará tu contraseña ni se creará una cuenta en un servidor.
            </p>
          </header>

          <form class="formulario" id="formulario-registro">
            <p
              class="mensaje-error"
              id="mensaje-error"
              role="alert"
              aria-live="assertive"
              tabindex="-1"
            ></p>

            <div class="campo">
              <label class="etiqueta-campo" for="nombre">Nombre completo</label>
              <input
                class="entrada"
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Ej. Carlos Mendoza"
                autocomplete="name"
                minlength="3"
                aria-describedby="mensaje-error"
                required
              />
            </div>

            <div class="campo">
              <label class="etiqueta-campo" for="edad">Edad</label>
              <input
                class="entrada"
                type="number"
                id="edad"
                name="edad"
                placeholder="Ej. 25"
                min="0"
                max="120"
                inputmode="numeric"
                aria-describedby="mensaje-error"
                required
              />
            </div>

            <div class="campo">
              <label class="etiqueta-campo" for="email">Correo electrónico</label>
              <input
                class="entrada"
                type="email"
                id="email"
                name="email"
                placeholder="nombre@ejemplo.com"
                autocomplete="email"
                aria-describedby="mensaje-error"
                required
              />
            </div>

            <div class="campo">
              <label class="etiqueta-campo" for="password">Contraseña</label>
              <input
                class="entrada"
                type="password"
                id="password"
                name="password"
                placeholder="Al menos 8 caracteres"
                autocomplete="new-password"
                minlength="8"
                aria-describedby="mensaje-error"
                required
              />
            </div>

            <div class="campo">
              <label class="etiqueta-campo" for="confirmarPassword">
                Confirmar contraseña
              </label>
              <input
                class="entrada"
                type="password"
                id="confirmarPassword"
                name="confirmarPassword"
                placeholder="Repite tu contraseña"
                autocomplete="new-password"
                minlength="8"
                aria-describedby="mensaje-error"
                required
              />
            </div>

            <button
              class="boton boton-principal"
              type="submit"
            >
              <span>Registrarse</span>
              <span class="boton-flecha" aria-hidden="true">→</span>
            </button>
          </form>

          <section
            class="acceso-secundario"
            aria-label="Información sobre el inicio de sesión"
          >
            <p class="texto-secundario">
              El inicio de sesión todavía no está disponible en esta versión.
            </p>
          </section>
        </article>
      </section>
    </main>

    <footer class="pie-sitio">
      <p>© 2026 Registro. Todos los derechos reservados.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
