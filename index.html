<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Registro</title>
  </head>
  <body>
    <header>
      <h1>Crea una cuenta</h1>
    </header>
    <main class="contenedor">
      <h1>REGISTRO DE USUARIO</h1>

      <p class="descripcion">Completá tus datos para continuar</p>
      <p id="mensaje-error"></p>

      <form onsubmit="registrarUsuario(event)">
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" required />
        </div>

        <div class="campo">
          <label for="edad">Edad</label>
          <input type="number" id="edad" required />
        </div>

        <div class="campo">
          <label for="email">Correo</label>
          <input type="email" id="email" required />
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password"  minlength="8"  required />
        </div>

        <div class="campo">
          <label for="confirmarPassword">Confirmar contraseña</label>
          <input type="password" id="confirmarPassword"  minlength="8"  required />
        </div>

        <button type="submit">Registrar</button>
      </form>
    </main>
    <footer>
      <p>&copy; 2026 Mi Sitio Web. Todos los derechos reservados.</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
