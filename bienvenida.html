<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tu cuenta se creó correctamente. Te damos la bienvenida."
    />
    <meta name="theme-color" content="#0d1b2a" />
    <title>Bienvenido | Registro</title>
    <link rel="icon" type="image/svg+xml" href="image/favicon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="cabecera-sitio">
      <a class="marca" href="index.html" aria-label="Registro, página de inicio">
        <span class="marca-icono" aria-hidden="true">R</span>
        <span class="marca-nombre">REGISTRO</span>
      </a>
    </header>

    <main class="contenido-principal">
      <section class="seccion-bienvenida" aria-labelledby="titulo-bienvenida">
        <article class="tarjeta tarjeta-bienvenida">
          <div
            class="insignia-bienvenida"
            id="insignia-bienvenida"
            aria-hidden="true"
          >
            <span class="insignia-check">✓</span>
          </div>
          <p class="etiqueta-seccion" id="etiqueta-bienvenida">
            REGISTRO COMPLETADO
          </p>
          <h1 class="titulo-principal" id="titulo-bienvenida">
            ¡Bienvenido a bordo!
          </h1>
          <p class="texto-intro" id="texto-bienvenida">
            Tu perfil se guardó en este navegador. No se creó una cuenta en un
            servidor y tu contraseña no se almacenó.
          </p>
          <p
            class="mensaje-estado"
            id="estado-bienvenida"
            role="status"
            aria-live="polite"
            hidden
          ></p>
          <button
            class="boton boton-secundario"
            id="boton-cerrar-sesion"
            type="button"
          >
            Cerrar sesión
          </button>
          <a
            class="boton boton-secundario"
            id="enlace-registro"
            href="index.html"
            hidden
          >
            Ir al registro
          </a>
        </article>
      </section>
    </main>

    <footer class="pie-sitio">
      <p>© 2026 Registro. Todos los derechos reservados.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
